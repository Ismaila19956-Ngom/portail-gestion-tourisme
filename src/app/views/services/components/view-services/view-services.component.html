<div style="background: #f5fdf7; padding: 60px 0 64px;">
    <div class="container">
        <!-- Titre -->
        <div class="row mb-4">
            <div class="col-lg-7 m-auto text-center">
                <h5 style="color: #F1B53B; text-transform: uppercase; font-size: 0.8rem; font-weight: 800; letter-spacing: 2px; margin-bottom: 10px;">Notre gamme</h5>
                <h2 style="color: #3E4F22; font-size: 1.9rem; font-weight: 900; margin-bottom: 0;">
                    Autres produits <span style="color: #556B2F;">d'assurance Sénégal Excursions</span>
                </h2>
            </div>
        </div>

        <div class="row">
            <div *ngFor="let service of services" class="col-lg-4 col-md-6">
                <app-service-card [service]="service" />
            </div>
        </div>
    </div>
</div>

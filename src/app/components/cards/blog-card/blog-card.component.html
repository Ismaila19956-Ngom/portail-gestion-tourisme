<div style="background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; transition: all 0.3s ease; display: flex; flex-direction: column; height: 100%;"
     onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 12px 35px rgba(85,107,47,0.15)'"
     onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 20px rgba(0,0,0,0.08)'">

    <!-- Image avec badge -->
    <div style="position: relative; overflow: hidden; height: 200px; border-radius: 12px 12px 0 0;">
        <img [src]="blog.image" alt="{{ blog.title }}"
             style="width: 100%; height: 200px; object-fit: cover; display: block; border-radius: 12px 12px 0 0; transition: transform 0.4s ease;">
        <!-- Badge catégorie -->
        <span style="position: absolute; top: 12px; left: 12px; background: #F1B53B; color: #1a1a1a; font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px;">
            {{ blog.authorRole }}
        </span>
    </div>

    <!-- Contenu -->
    <div style="padding: 20px; display: flex; flex-direction: column; flex: 1;">

        <!-- Date -->
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 12px;">
            <i class="fa-solid fa-calendar-days" style="color: #1a8a47; font-size: 0.8rem;"></i>
            <span style="font-size: 0.8rem; color: #666; font-weight: 500;">{{ blog.date }}</span>
        </div>

        <!-- Titre -->
        <a routerLink="/blogs/single"
           style="font-size: 1rem; font-weight: 700; color: #3E4F22; line-height: 1.4; text-decoration: none; display: block; margin-bottom: 10px; transition: color 0.3s;"
           onmouseover="this.style.color='#1a8a47'"
           onmouseout="this.style.color='#3E4F22'">
            {{ blog.title }}
        </a>

        <!-- Description (2 lignes max) -->
        <p style="font-size: 0.87rem; color: #666; line-height: 1.55; margin-bottom: 18px; flex: 1;
                  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
            {{ blog.description }}
        </p>

        <!-- Bouton Lire la suite -->
        <a routerLink="/blogs/single"
           style="display: inline-flex; align-items: center; gap: 6px; color: #556B2F; font-weight: 700; font-size: 0.85rem; text-decoration: none; transition: all 0.3s; padding: 8px 0; border-top: 1px solid #e8f4ec;"
           onmouseover="this.style.color='#1a8a47'; this.style.gap='10px'"
           onmouseout="this.style.color='#556B2F'; this.style.gap='6px'">
            Lire la suite <i class="fa-solid fa-arrow-right" style="font-size: 0.8rem;"></i>
        </a>
    </div>
</div>
